<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="provider-reliability — a token stream that stalls mid-sentence while the status page says operational">
  <style>
    .tick { animation: tick 3s steps(1) infinite; }
    .stall { animation: stall 3s steps(1) infinite; }
    .ok-dot { animation: okp 3s steps(1) infinite; }
    @keyframes tick { 0%,100% { opacity: 1; } }
    @keyframes stall { 0%,55% { opacity: 0; } 56%,85% { opacity: 1; } 86%,100% { opacity: 0; } }
    @keyframes okp { 0%,55% { opacity: 1; } 56%,85% { opacity: .25; } 86%,100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .tick, .stall, .ok-dot { animation: none; } .stall { opacity: 1; } }
  </style>

  <rect width="1200" height="320" fill="#0b0806"/>

  <text x="60" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="52" font-weight="700" fill="#F8F5F2">provider-reliability</text>
  <text x="60" y="116" font-family="ui-monospace, Menlo, monospace" font-size="17" letter-spacing="1.5" fill="#FE9106">the wire, not the status page</text>
  <rect x="60" y="130" width="110" height="3" fill="#FE9106"/>

  <!-- status line: green until the stall window, then dim -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="14">
    <circle class="ok-dot" cx="70" cy="180" r="6" fill="#7dc98f"/>
    <text class="ok-dot" x="88" y="185" fill="#7dc98f">status: operational</text>
  </g>

  <!-- token stream: regular ticks, then a gap, then resume -->
  <g fill="#FE9106">
    <rect x="320" y="172" width="4" height="16"/><rect x="340" y="172" width="4" height="16"/>
    <rect x="360" y="172" width="4" height="16"/><rect x="380" y="172" width="4" height="16"/>
    <rect x="400" y="172" width="4" height="16"/><rect x="420" y="172" width="4" height="16"/>
    <rect x="440" y="172" width="4" height="16"/><rect x="460" y="172" width="4" height="16"/>
  </g>
  <!-- the stall: empty space + label -->
  <g class="stall">
    <line x1="480" y1="180" x2="700" y2="180" stroke="#F05F03" stroke-width="2" stroke-dasharray="3 6"/>
    <text x="520" y="165" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#F05F03">40s of nothing</text>
  </g>
  <g fill="#FE9106">
    <rect x="720" y="172" width="4" height="16"/><rect x="740" y="172" width="4" height="16"/>
    <rect x="760" y="172" width="4" height="16"/><rect x="780" y="172" width="4" height="16"/>
  </g>
  <text x="820" y="185" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#b7a496">finish_reason: stop</text>

  <!-- gap histogram hint -->
  <g fill="#5c4c3f">
    <rect x="320" y="240" width="14" height="30"/><rect x="340" y="244" width="14" height="26"/>
    <rect x="360" y="248" width="14" height="22"/><rect x="380" y="252" width="14" height="18"/>
    <rect x="400" y="258" width="14" height="12"/>
  </g>
  <rect x="430" y="210" width="14" height="60" fill="#F05F03"/>
  <text x="320" y="292" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6e5c50">inter-token gap distribution — the stall's only fingerprint</text>

  <text x="60" y="310" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#6e5c50">methodology + harness design · aggregated stats published, raw traffic never</text>
</svg>
